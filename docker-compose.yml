version: '3.8'

services:
  bot:
    container_name: tag-all-bot
    image: tag-all-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/app
    command: "python bot.py"
    restart: unless-stopped

